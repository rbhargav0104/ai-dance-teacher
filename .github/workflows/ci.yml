name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libegl1 libgles2 libgl1
      - name: Install dependencies
        run: uv sync --extra vision --locked
      - name: Cache pose model
        uses: actions/cache@v4
        with:
          path: models
          key: pose-model-4eaa5eb7a983
      - name: Download pose model (SHA-256 pinned)
        working-directory: .
        run: scripts/download_model.sh
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy
      - name: Tests
        run: uv run pytest -v
      - name: Pose runtime smoke
        run: uv run python -m app.pose.verify

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  smoke:
    # Both services boot from a clean checkout, the web app reaches the API, and (READY) the
    # sample is analysed end to end by the real worker + MediaPipe.
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libegl1 libgles2 libgl1
      - name: Cache pose model
        uses: actions/cache@v4
        with:
          path: models
          key: pose-model-4eaa5eb7a983
      - name: Install
        run: |
          cp .env.example .env
          scripts/download_model.sh
          (cd backend && uv sync --extra vision --locked)
          (cd frontend && npm ci && npm run build)
      - name: Migrate and start
        run: |
          (cd backend && uv run alembic upgrade head)
          (cd backend && nohup uv run uvicorn app.main:app --port 8000 > ../api.log 2>&1 &)
          (cd frontend && nohup npm start > ../web.log 2>&1 &)
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8000/api/health/live >/dev/null 2>&1 && curl -fsS http://localhost:3000/ >/dev/null 2>&1 && break
            sleep 1
          done
      - name: Smoke
        run: scripts/smoke.sh
      - name: Teacher Mode browser check (3D avatar vs measured landmarks)
        run: |
          mkdir -p /tmp/pw e2e-shots
          (cd /tmp/pw && npm init -y >/dev/null && npm install --no-audit --no-fund playwright@1.63.0 && npx playwright install --with-deps chromium)
          NODE_PATH=/tmp/pw/node_modules node scripts/e2e/teacher-mode.cjs e2e-shots
      - name: Practice browser check (fake webcam fed real footage → real learner pose → side by side)
        run: NODE_PATH=/tmp/pw/node_modules node scripts/e2e/practice.cjs e2e-shots/practice
      - name: Upload Teacher Mode screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teacher-mode-screenshots
          path: e2e-shots
          if-no-files-found: ignore
      - name: Smoke (LIMITED without the vision stack)
        run: |
          pkill -f "uvicorn app.main:app" || true
          sleep 1
          (cd backend && uv sync --locked && nohup uv run uvicorn app.main:app --port 8000 > ../api-limited.log 2>&1 &)
          for i in $(seq 1 60); do curl -fsS http://localhost:8000/api/health/live >/dev/null 2>&1 && break; sleep 1; done
          scripts/smoke.sh
      - name: Logs on failure
        if: failure()
        run: tail -n 100 api.log api-limited.log web.log || true
