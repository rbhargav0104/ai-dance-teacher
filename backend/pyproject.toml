[project]
name = "ai-dance-teacher-backend"
version = "0.1.0"
description = "AI Dance Teacher API and analysis worker"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "pydantic==2.11.4",
  "pydantic-settings==2.9.1",
  "sqlalchemy==2.0.40",
  "alembic==1.15.2",
  "python-multipart==0.0.20",
  "itsdangerous==2.2.0",
]

[project.optional-dependencies]
vision = [
  "mediapipe==1.2.3",
  "opencv-python-headless>=4.10,<5",
  "numpy>=1.26,<3",
  "scipy>=1.13,<2",
]

[dependency-groups]
dev = [
  "pytest==8.3.5",
  "httpx==0.28.1",
  "ruff==0.11.8",
  "mypy==1.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "SIM"]
ignore = ["S101", "N818", "SIM300"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S603", "S607", "N812"]
"app/pose/**" = ["N812"]
"app/pipeline/**" = ["N812"]
"app/services/sections.py" = ["N812"]
"app/api/projects.py" = ["N812"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app"]

[[tool.mypy.overrides]]
module = ["mediapipe.*", "cv2.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
